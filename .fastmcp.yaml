name: openproject-mcp
version: 1.1.0
description: OpenProject MCP Server for internal use - FastMCP, API v3
runtime: python3.10

# Entry point for SSE transport
entry_point: openproject-mcp-sse.py

# Environment variables (configure on FastMCP Cloud dashboard)
env:
  - OPENPROJECT_URL
  - OPENPROJECT_API_KEY
  - OPENPROJECT_PROXY  # Optional
  - LOG_LEVEL  # Optional, default: INFO
  - TEST_CONNECTION_ON_STARTUP  # Optional, default: false

# Resources allocation
resources:
  memory: 512MB
  cpu: 0.5

# Health check endpoint
health_check:
  path: /health
  interval: 30s
  timeout: 5s
  unhealthy_threshold: 3

# Files to include in deployment
include:
  - openproject_mcp/**/*.py
  - openproject-mcp-sse.py
  - pyproject.toml
  - README.md
  - env_example.txt

# Files to exclude from deployment
exclude:
  - .venv/**
  - __pycache__/**
  - tests/**
  - docs/**
  - apps/**
  - deploy/**
  - *.log
  - .env  # Never commit actual .env file
  - .git/**
  - .gitignore
  - data/**
  - logs/**
  - certs/**
  - openproject-mcp-http.py  # local HTTP entry point, not for cloud
  - openproject-mcp-fastmcp.py  # stdio version, not needed for cloud
  - test_*.py

# Dependencies (auto-detected from pyproject.toml)

# Timeout settings
timeout:
  read: 30s
  write: 30s
  idle: 120s

# Logging
logging:
  level: INFO
  format: json
  retention: 7d
